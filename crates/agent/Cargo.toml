[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "Runs on each player's PC: Dota GSI -> relay, team overlay, build helper"

[[bin]]
name = "cyberspyde-agent"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# wss:// for the public relay; ring as the crypto backend (builds with MinGW, no cmake/nasm).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
toml = "0.8"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
global-hotkey = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_Security"] }
