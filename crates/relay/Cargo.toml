[package]
name = "relay"
version.workspace = true
edition.workspace = true
description = "Team relay: receives each player's own game state and fans it out to the team"

[[bin]]
name = "cyberspyde-relay"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tokio = { workspace = true, features = ["fs"] }
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
# Ollama on loopback, and OpenDota over HTTPS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
# Client side of the Codex app server (local WebSocket, no TLS).
tokio-tungstenite.workspace = true
