<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CYBERSPYDE Team Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090d;
  --bg2: #0c1017;
  --glass: rgba(22, 28, 38, 0.62);
  --glass-hi: rgba(36, 46, 62, 0.7);
  --line: rgba(160, 190, 230, 0.12);
  --line-hi: rgba(120, 230, 210, 0.35);
  --text: #e9eef5;
  --text2: #a8b3c4;
  --muted: #6c788b;
  --accent: #35e0bd;
  --accent2: #7c8cff;
  --good: #3fcf6e;
  --warn: #f0b429;
  --bad: #ff5a5f;
  --mana: #4b8dff;
  --radius: 14px;
  --display: "Chakra Petch", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(1100px 600px at 85% -10%, rgba(53, 224, 189, 0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(124, 140, 255, 0.10), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 50px -30px rgba(0,0,0,0.8);
}
h1, h2, h3, .display { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.05; margin: 0 0 18px; font-weight: 700; }
h2 { font-size: 24px; margin: 0 0 14px; font-weight: 600; }
h3 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--muted); }
.text2 { color: var(--text2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: rgba(7, 9, 13, 0.72); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 22px; height: 62px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; letter-spacing: 0.12em; color: var(--text); }
.logo .mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 18px rgba(53, 224, 189, 0.45); position: relative; }
.logo .mark::after { content: ""; position: absolute; inset: 7px; border-radius: 3px; background: var(--bg); }
.logo small { color: var(--muted); font-weight: 600; letter-spacing: 0.08em; }
nav.main { display: flex; gap: 4px; margin-left: auto; }
nav.main a { color: var(--text2); padding: 7px 12px; border-radius: 9px; font-weight: 500; font-size: 14px; }
nav.main a:hover, nav.main a.on { color: var(--text); background: rgba(255,255,255,0.06); }

.btn { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--line); background: var(--glass-hi);
  padding: 11px 18px; border-radius: 11px; cursor: pointer; font-weight: 600; color: var(--text); transition: border-color .15s, transform .15s; }
.btn:hover { border-color: var(--line-hi); transform: translateY(-1px); }
.btn.primary { background: linear-gradient(135deg, #2fd9b5, #5aa8ff); color: #041016; border: 0; box-shadow: 0 10px 30px -10px rgba(53,224,189,0.6); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }

/* landing */
.hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center; padding: 72px 0 40px; }
.kicker { display: inline-flex; gap: 8px; align-items: center; font: 600 12px var(--display); letter-spacing: .16em; color: var(--accent);
  text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--line-hi); border-radius: 99px; margin-bottom: 20px; }
.hero p.lead { font-size: 18px; color: var(--text2); max-width: 560px; margin: 0 0 28px; }
.grad { background: linear-gradient(120deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.dlmeta { font-size: 13px; color: var(--muted); margin-top: 12px; }
.shot { padding: 14px; position: relative; }
.shot img { width: 100%; display: block; border-radius: 10px; }
.shot .tag { position: absolute; top: -12px; right: 18px; }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 20px 0 30px; }
.feature { padding: 22px; }
.feature .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px;
  background: rgba(53, 224, 189, 0.12); color: var(--accent); font: 700 16px var(--display); }
.feature p { margin: 0; color: var(--text2); font-size: 14px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 10px 0 70px; }
.step { padding: 22px; }
.step .n { font: 700 34px var(--display); color: var(--accent); opacity: .9; }
.step p { margin: 6px 0 0; color: var(--text2); font-size: 14px; }
code, kbd { font: 13px ui-monospace, "Cascadia Code", Consolas, monospace; background: rgba(255,255,255,0.07); padding: 1px 6px; border-radius: 5px; }
footer { border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--muted); font-size: 13px; }

/* team area */
.page { padding-top: 30px; padding-bottom: 70px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; padding: 4px; }
.tabs a { padding: 8px 16px; border-radius: 10px; color: var(--text2); font-weight: 600; font-size: 14px; }
.tabs a.on { background: rgba(53,224,189,0.14); color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: rgba(255,255,255,0.06); color: var(--text2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--good); background: rgba(63,207,110,0.12); }
.pill.bad { color: var(--bad); background: rgba(255,90,95,0.12); }
.pill.warn { color: var(--warn); background: rgba(240,180,41,0.12); }
.pill.acc { color: var(--accent); background: rgba(53,224,189,0.12); }
.keybox { max-width: 460px; margin: 60px auto; padding: 30px; text-align: center; }
.keybox input { width: 100%; margin: 16px 0 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(0,0,0,0.35); outline: none; }
.keybox input:focus { border-color: var(--line-hi); }

/* live */
.livegrid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
.pcard { padding: 16px; position: relative; overflow: hidden; }
.pcard.dead { opacity: .6; }
.pcard.attack { border-color: rgba(255,90,95,.6); box-shadow: 0 0 0 1px rgba(255,90,95,.35), 0 0 30px -8px rgba(255,90,95,.6); }
.pcard .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pcard .nm { font: 600 17px var(--display); }
.pcard .hr { color: var(--text2); font-size: 13px; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); color: var(--text2); }
.chip.g { color: var(--good); background: rgba(63,207,110,0.12); }
.chip.r { color: var(--bad); background: rgba(255,90,95,0.12); }
.chip.y { color: var(--warn); background: rgba(240,180,41,0.12); }
.chip.k { color: #ffd479; background: rgba(255,212,121,0.10); }
.side { display: flex; flex-direction: column; gap: 12px; }
.mapbox { padding: 12px; }
.mapbox svg { width: 100%; height: auto; display: block; }
.feed { padding: 14px; max-height: 330px; overflow: auto; font-size: 13px; }
.feed div { padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--text2); }
.feed div span { color: var(--muted); font-size: 11px; margin-right: 6px; }
.note { display: flex; gap: 8px; padding: 12px; }
.note input, .note select { padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: rgba(0,0,0,.3); outline: none; min-width: 0; }
.note input { flex: 1; }

/* matches */
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mrow { display: grid; grid-template-columns: 110px 1fr auto; gap: 18px; align-items: center; padding: 14px 18px; cursor: pointer; transition: border-color .15s; }
.mrow:hover { border-color: var(--line-hi); }
.res { font: 700 15px var(--display); letter-spacing: .06em; }
.res.w { color: var(--good); } .res.l { color: var(--bad); }
.heroes { display: flex; gap: 8px; flex-wrap: wrap; }
.hchip { display: flex; align-items: center; gap: 7px; padding: 4px 9px 4px 4px; border-radius: 9px; background: rgba(255,255,255,0.05); font-size: 13px; }
.fchip { font: 600 11.5px var(--display); padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.07); color: var(--text2); }
.fchip.bad { color: var(--bad); background: rgba(255,90,95,0.12); } .fchip.good { color: var(--good); background: rgba(63,207,110,0.12); }
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* match detail */
.mhead { padding: 24px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; margin-bottom: 16px; }
.mhead .big { font: 700 34px var(--display); }
.stats { display: flex; gap: 26px; flex-wrap: wrap; }
.stat b { display: block; font: 700 24px var(--display); }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.panel { padding: 20px; }
.panel h2 { font-size: 18px; }
.chart { position: relative; }
.chart svg { width: 100%; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: rgba(10,14,20,0.95); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; font-size: 12.5px; min-width: 140px; transform: translate(-50%, calc(-100% - 12px)); display: none; z-index: 5; white-space: nowrap; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text2); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.prep { padding: 20px; }
.prep .top { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.prep .title { color: var(--accent); font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.m { padding: 9px 10px; border-radius: 10px; background: rgba(255,255,255,0.04); }
.m b { display: block; font: 600 16px var(--display); }
.m span { font-size: 11px; color: var(--muted); line-height: 1.25; display: block; }
.m.badv b { color: var(--bad); } .m.goodv b { color: var(--good); }
.facts { list-style: none; padding: 0; margin: 4px 0 0; }
.facts li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.facts li:first-child { border-top: 0; }
.facts .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.facts .good .dot { background: var(--good); } .facts .bad .dot { background: var(--bad); }
.facts .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,0.06); color: var(--muted); }
.tag.better { color: var(--good); background: rgba(63,207,110,0.10); } .tag.worse { color: var(--bad); background: rgba(255,90,95,0.10); }
.noapp { font-size: 12px; color: var(--warn); }
.replay { display: none; margin-top: 14px; padding: 14px; border-radius: 12px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
.replay.on { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
.replay canvas { width: 240px; height: 240px; border-radius: 10px; background: rgba(255,255,255,0.03); }
.replay .ctl { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.replay input[type=range] { flex: 1; accent-color: var(--accent); }
.replay .who { font-size: 13px; color: var(--text2); line-height: 1.8; }
.replay .who i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
@media (max-width: 700px) { .replay.on { grid-template-columns: 1fr; } }
.moments { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13.5px; }
.moments li { padding: 6px 0 6px 52px; position: relative; color: var(--text2); border-top: 1px solid var(--line); }
.moments li time { position: absolute; left: 0; top: 6px; font: 600 12px var(--display); color: var(--muted); }
.moments.bad li::before, .moments.good li::before { content: ""; position: absolute; left: 40px; top: 13px; width: 6px; height: 6px; border-radius: 50%; }
.moments.bad li::before { background: var(--bad); } .moments.good li::before { background: var(--good); }
.ai { padding: 22px; margin-bottom: 16px; border-color: rgba(124,140,255,0.3); }
.ai .body { white-space: pre-wrap; color: var(--text2); line-height: 1.65; }
.ai .body b { color: var(--text); }
.spark { width: 100%; height: 40px; display: block; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
details summary { cursor: pointer; color: var(--text2); font-size: 13px; margin-top: 10px; }

@media (max-width: 900px) {
  .hero, .livegrid, .two, .mhead { grid-template-columns: 1fr; }
  .features, .steps { grid-template-columns: 1fr; }
  .mrow { grid-template-columns: 1fr; gap: 8px; }
  nav.main a.opt { display: none; }
  .hero { padding-top: 40px; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 16px; }
  header.top .wrap { gap: 10px; }
  .logo small { display: none; }
  nav.main a { padding: 7px 8px; }
  .players { grid-template-columns: 1fr; }
  .mgrid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><span class="mark"></span>CYBERSPYDE <small>TEAM LINK</small></a>
    <nav class="main">
      <a href="#/" data-nav="home" class="opt">Home</a>
      <a href="#/live" data-nav="live">Live</a>
      <a href="#/matches" data-nav="matches">Matches</a>
      <a href="#/players" data-nav="players">Players</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer>
  <div class="wrap">CYBERSPYDE Team Link. Uses Valve's official Game State Integration: each player shares only their own data. Not affiliated with Valve.</div>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const app = $("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss = (s) => `${s < 0 ? "-" : ""}${Math.floor(Math.abs(s) / 60)}:${String(Math.abs(s) % 60).padStart(2, "0")}`;
const km = (d) => `${(d / 1000).toFixed(1)}k`;
const SPECIAL = {antimage:"Anti-Mage",nevermore:"Shadow Fiend",zuus:"Zeus",obsidian_destroyer:"Outworld Destroyer",wisp:"Io",
  magnataur:"Magnus",furion:"Nature's Prophet",skeleton_king:"Wraith King",rattletrap:"Clockwerk",shredder:"Timbersaw",
  treant:"Treant Protector",windrunner:"Windranger",vengefulspirit:"Vengeful Spirit",queenofpain:"Queen of Pain",
  doom_bringer:"Doom",centaur:"Centaur Warrunner",life_stealer:"Lifestealer",abyssal_underlord:"Underlord",necrolyte:"Necrophos",
  black_king_bar:"BKB",ultimate_scepter:"Aghanim's",sheepstick:"Hex",cyclone:"Eul's",tpscroll:"TP",ward_observer:"Observer",
  ward_sentry:"Sentry",bfury:"Battle Fury",sphere:"Linken's",invis_sword:"Shadow Blade",greater_crit:"Daedalus",
  assault:"Assault Cuirass",power_treads:"Treads",travel_boots:"BoTs",blink:"Blink"};
const nice = (h) => SPECIAL[h] || String(h || "").split("_").filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const KEY_ITEMS = new Set(["black_king_bar","blink","overwhelming_blink","swift_blink","arcane_blink","glimmer_cape","force_staff",
  "hurricane_pike","sheepstick","cyclone","wind_waker","lotus_orb","pipe","mekansm","guardian_greaves","refresher","aeon_disk",
  "sphere","silver_edge","invis_sword","abyssal_blade","bloodthorn","orchid","nullifier","smoke_of_deceit","gem","aegis","cheese"]);

// ---- team key: arrives once as #key=..., then lives in this browser only.
let key = "";
try { key = localStorage.getItem("teamKey") || ""; } catch (e) {}
/// A link like /#key=... (from the host) stores the key, then drops it from the address bar.
function takeKeyFromUrl() {
  const m = location.hash.match(/key=([^&]+)/);
  if (!m) return false;
  key = decodeURIComponent(m[1]);
  try { localStorage.setItem("teamKey", key); } catch (e) {}
  history.replaceState(null, "", location.pathname + "#/live");
  return true;
}
function setKey(k) { key = k.trim(); try { localStorage.setItem("teamKey", key); } catch (e) {} }
function forgetKey() { key = ""; try { localStorage.removeItem("teamKey"); } catch (e) {} route(); }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "x-team-key": key, ...(opts.headers || {}) } });
  if (r.status === 401) { const e = new Error("key"); e.code = 401; throw e; }
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ---- router
const routes = { "": home, "live": live, "matches": matches, "match": matchPage, "players": players };
let cleanup = null;
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  takeKeyFromUrl();
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const name = parts[0] || "";
  document.querySelectorAll("nav.main a").forEach(a => a.classList.toggle("on", a.dataset.nav === (name || "home") || (name === "match" && a.dataset.nav === "matches")));
  window.scrollTo(0, 0);
  (routes[name] || home)(parts[1]);
}
window.addEventListener("hashchange", route);

function needKey(next) {
  app.innerHTML = `<div class="wrap"><div class="keybox glass">
    <h2>Team area</h2>
    <p class="text2 small">Live view, match history and post-game reports are for the team only. Enter the team key from your host.</p>
    <form id="kf"><input id="ki" type="password" placeholder="Team key" autocomplete="off" autofocus>
    <button class="btn primary" style="width:100%;justify-content:center">Enter</button></form>
    <p id="kerr" class="small" style="color:var(--bad);min-height:20px"></p></div></div>`;
  $("kf").onsubmit = async (e) => {
    e.preventDefault();
    setKey($("ki").value);
    try { await api("/api/matches"); next(); }
    catch (err) { $("kerr").textContent = err.code === 401 ? "That key is not right." : "Server unreachable, try again."; }
  };
}

// ---------------------------------------------------------------- home
async function home() {
  app.innerHTML = `<div class="wrap">
  <section class="hero">
    <div>
      <div class="kicker">Dota 2 &middot; for five friends</div>
      <h1>Play like a five-stack that <span class="grad">actually talks.</span></h1>
      <p class="lead">A small overlay that shows your teammates' HP, ultimates, TPs and key items in real time, warns you when someone is ganked, and after every game shows in plain words how each of you helped the team, and where it went wrong.</p>
      <div class="ctas">
        <a class="btn primary" id="dl" href="/download/cyberspyde-agent.exe">Download for Windows</a>
        <a class="btn" href="#/live">Team area</a>
      </div>
      <div class="dlmeta" id="dlmeta">One program, nothing to install. Windows 10 / 11.</div>
    </div>
    <div class="shot glass"><span class="pill acc tag">in-game overlay</span><img src="/assets/overlay.png" alt="The overlay showing four teammates with health, ultimate and TP status" onerror="this.parentNode.style.display='none'"></div>
  </section>
  <section class="features">
    <div class="feature glass"><div class="ico">01</div><h3>Live team link</h3><p>Everyone's own game data goes to the team server and on to the others in milliseconds, even when you're in different countries.</p></div>
    <div class="feature glass"><div class="ico">02</div><h3>Alerts that matter</h3><p>"Azim under attack, 2.1k away, TP ready." Fight banners, retreat calls, ward and buyback reminders tuned to each player.</p></div>
    <div class="feature glass"><div class="ico">03</div><h3>Post-game truth</h3><p>Not damage or KDA; Dota already shows those. Fights joined or skipped, help calls answered, deaths alone, gold left unspent, plus an AI coach's review.</p></div>
  </section>
  <h2 class="display" style="margin-top:30px">Set up in a minute</h2>
  <section class="steps">
    <div class="step glass"><div class="n">1</div><h3>Run the program</h3><p>Type your name and the team key. Pick a look and where the overlay sits.</p></div>
    <div class="step glass"><div class="n">2</div><h3>Tell Dota about it</h3><p>Add <code>-gamestateintegration</code> to Dota 2's launch options in Steam, and use <b>Borderless window</b>.</p></div>
    <div class="step glass"><div class="n">3</div><h3>Play</h3><p><kbd>Num *</kbd> opens the menu, <kbd>Num .</kbd> hides the overlay, <kbd>Num 1-6</kbd> send callouts.</p></div>
  </section></div>`;
  try {
    const info = await (await fetch("/api/info")).json();
    if (info.available) {
      $("dlmeta").textContent = `Version ${info.version || "latest"} · ${(info.size / 1048576).toFixed(1)} MB · Windows 10 / 11 · nothing to install`;
    } else {
      $("dl").setAttribute("disabled", ""); $("dl").removeAttribute("href"); $("dl").textContent = "Download coming soon";
    }
  } catch (e) {}
}

// ---------------------------------------------------------------- live
function live() {
  if (!key) return needKey(live);
  app.innerHTML = `<div class="wrap page">
    <div class="pagehead"><div><h2 class="display" style="margin:0">Live</h2>
      <div class="small muted" id="livesub">Everyone running the program shows up here.</div></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="pill" id="clock">--:--</span><span class="pill" id="rtt">-- ms</span><span class="pill bad" id="conn"><span class="dot"></span>offline</span></div></div>
    <div class="livegrid">
      <div class="cards" id="cards"></div>
      <div class="side">
        <div class="mapbox glass"><svg id="map" viewBox="0 0 200 200" role="img" aria-label="Team positions on the map"></svg></div>
        <div class="feed glass" id="feed"><div class="muted">Callouts and notes appear here.</div></div>
        <form class="note glass" id="noteForm"><select id="noteTo"><option value="">Everyone</option></select>
          <input id="noteText" maxlength="200" placeholder="Tip for the team"><button class="btn small">Send</button></form>
      </div>
    </div></div>`;
  const members = new Map();
  let ws, me = null, pingSeq = 0, closed = false;
  const pingSent = new Map();
  const feedEl = $("feed");
  let feedEmpty = true;
  function feed(html) {
    if (feedEmpty) { feedEl.innerHTML = ""; feedEmpty = false; }
    const d = document.createElement("div");
    d.innerHTML = `<span>${new Date().toLocaleTimeString()}</span>${html}`;
    feedEl.prepend(d);
    while (feedEl.children.length > 40) feedEl.lastChild.remove();
  }
  function underAttack(m) {
    const now = performance.now();
    m.hpHist = (m.hpHist || []).filter(([t]) => now - t < 2500);
    if (!m.state || !m.state.alive || m.hpHist.length < 2) return false;
    const peak = Math.max(...m.hpHist.map(([, f]) => f));
    return peak - m.hpHist[m.hpHist.length - 1][1] >= 0.12;
  }
  function render() {
    const cards = []; let clock = null; const dots = [];
    const sel = $("noteTo"); if (!sel) return; const cur = sel.value;
    sel.innerHTML = '<option value="">Everyone</option>';
    for (const [id, m] of members) {
      if (m.role !== "player") continue;
      sel.insertAdjacentHTML("beforeend", `<option value="${id}">${esc(m.name)}</option>`);
      const s = m.state;
      if (!s || !s.hero) {
        cards.push(`<div class="pcard glass"><div class="who"><span class="nm">${esc(m.name)}</span><span class="pill">in menu</span></div>
          <div class="small muted" style="margin-top:8px">Connected, not in a match yet.</div></div>`);
        continue;
      }
      clock = s.clock;
      const hp = s.max_health ? s.health / s.max_health : 0;
      const mp = s.max_mana ? s.mana / s.max_mana : 0;
      const ult = (s.abilities || []).find(a => a.ultimate);
      const atk = underAttack(m);
      const chips = [];
      if (ult && ult.level > 0) chips.push(ult.cooldown > 0 ? `<span class="chip">ULT ${ult.cooldown}s</span>` : `<span class="chip g">ULT ready</span>`);
      chips.push(!s.tp ? `<span class="chip r">no TP</span>` : s.tp.cooldown > 0 ? `<span class="chip">TP ${s.tp.cooldown}s</span>` : `<span class="chip g">TP ready</span>`);
      const bbOk = s.buyback_cooldown === 0 && s.gold >= s.buyback_cost;
      chips.push(`<span class="chip ${bbOk ? "g" : "y"}">BB ${bbOk ? "ok" : s.buyback_cooldown > 0 ? s.buyback_cooldown + "s" : "no gold"}</span>`);
      const wards = (s.items || []).filter(i => i.name === "ward_observer" || i.name === "ward_dispenser").reduce((n, i) => n + (i.charges || 1), 0);
      if (wards) chips.push(`<span class="chip y">${wards} obs</span>`);
      if (s.smoked) chips.push(`<span class="chip k">smoked</span>`);
      const items = (s.items || []).map(i => `<span class="chip ${KEY_ITEMS.has(i.name) ? "k" : ""}">${esc(nice(i.name))}${i.cooldown > 0 ? " " + i.cooldown : ""}</span>`).join("");
      cards.push(`<div class="pcard glass ${!s.alive ? "dead" : ""} ${atk ? "attack" : ""}">
        <div class="who"><span class="nm">${esc(m.name)}</span>${!s.alive ? `<span class="pill bad">dead ${s.respawn_seconds}s</span>` : atk ? `<span class="pill bad"><span class="dot"></span>under attack</span>` : `<span class="hr">lvl ${s.level}</span>`}</div>
        <div class="hr">${esc(nice(s.hero))} &middot; ${s.gold} gold</div>
        <div class="bar"><i style="width:${hp * 100}%;background:${hp < .3 ? "var(--bad)" : "var(--good)"}"></i></div>
        <div class="bar" style="height:4px;margin-top:4px"><i style="width:${mp * 100}%;background:var(--mana)"></i></div>
        <div class="chips">${chips.join("")}</div>
        <div class="chips">${items}</div></div>`);
      if (s.has_pos && s.alive) dots.push({ x: s.x, y: s.y, name: m.name, atk });
    }
    sel.value = cur;
    $("cards").innerHTML = cards.join("") || `<div class="pcard glass empty" style="grid-column:1/-1">Nobody is online. Start the program and it shows up here.</div>`;
    if (clock !== null) $("clock").textContent = mmss(clock);
    // Map: world -8200..8200 to 0..200, y up.
    const sx = (x) => 100 + x / 8200 * 96, sy = (y) => 100 - y / 8200 * 96;
    $("map").innerHTML = `<rect x="2" y="2" width="196" height="196" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(160,190,230,0.12)"/>
      <path d="M12 188 L188 12" stroke="rgba(124,140,255,0.18)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="18" cy="182" r="9" fill="rgba(63,207,110,0.18)"/><circle cx="182" cy="18" r="9" fill="rgba(255,90,95,0.18)"/>` +
      dots.map(d => `<g><circle cx="${sx(d.x)}" cy="${sy(d.y)}" r="5" fill="${d.atk ? "var(--bad)" : "var(--accent)"}" stroke="#07090d" stroke-width="2"/>
        <text x="${sx(d.x) + 7}" y="${sy(d.y) + 4}" fill="#cfd8e6" font-size="9" font-family="Inter">${esc(d.name.slice(0, 9))}</text></g>`).join("");
  }
  function connect() {
    if (closed) return;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => ws.send(JSON.stringify({ t: "hello", key, name: "board", role: "viewer", version: 1 }));
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      switch (m.t) {
        case "welcome": me = m.you; members.clear(); for (const x of m.members) members.set(x.id, { ...x, hpHist: [] });
          $("conn").innerHTML = '<span class="dot"></span>live'; $("conn").className = "pill ok"; break;
        case "joined": members.set(m.member.id, { ...m.member, hpHist: [] }); if (m.member.role === "player") feed(`${esc(m.member.name)} joined`); break;
        case "left": { const x = members.get(m.id); if (x && x.role === "player") feed(`${esc(x.name)} left`); members.delete(m.id); break; }
        case "state": { const x = members.get(m.id); if (!x) break; x.state = m.state;
          if (m.state.max_health) x.hpHist.push([performance.now(), m.state.health / m.state.max_health]); break; }
        case "callout": { const x = members.get(m.id); feed(`<b>${esc(x ? x.name : "?")}:</b> ${esc(m.kind.replace("_", " ").toUpperCase())}`); break; }
        case "note": { const x = m.id === me ? { name: "you (site)" } : members.get(m.id) || { name: "site" }; const to = m.to ? members.get(m.to) : null;
          feed(`<b>${esc(x.name)}${to ? " &rarr; " + esc(to.name) : ""}:</b> ${esc(m.text)}`); break; }
        case "pong": { const t = pingSent.get(m.id); if (t) $("rtt").textContent = `${Math.round(performance.now() - t)} ms`; pingSent.delete(m.id); break; }
        case "error": feed(`<b>server:</b> ${esc(m.message)}`); if (/key/.test(m.message)) { closed = true; forgetKey(); } break;
      }
      render();
    };
    ws.onclose = () => { const c = $("conn"); if (c) { c.innerHTML = '<span class="dot"></span>offline'; c.className = "pill bad"; } if (!closed) setTimeout(connect, 1500); };
  }
  const timer = setInterval(() => {
    if (ws && ws.readyState === 1) { const id = ++pingSeq; pingSent.set(id, performance.now()); ws.send(JSON.stringify({ t: "ping", id })); }
    render();
  }, 1000);
  $("noteForm").onsubmit = (e) => {
    e.preventDefault();
    const text = $("noteText").value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    const to = $("noteTo").value ? Number($("noteTo").value) : null;
    ws.send(JSON.stringify({ t: "note", to, text }));
    $("noteText").value = "";
  };
  connect(); render();
  cleanup = () => { closed = true; clearInterval(timer); if (ws) ws.close(); };
}

// ---------------------------------------------------------------- matches
const dateStr = (ms) => ms ? new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

async function matches() {
  if (!key) return needKey(matches);
  app.innerHTML = `<div class="wrap page"><div class="pagehead"><div><h2 class="display" style="margin:0">Matches</h2>
    <div class="small muted">Every game where at least one of you ran the program. The report shows up about a minute after the game, and replay facts a few minutes later.</div></div></div>
    <div id="mlist" class="mlist"><div class="glass empty">Loading...</div></div></div>`;
  let data;
  try { data = await api("/api/matches"); } catch (e) { if (e.code === 401) { forgetKey(); return; } $("mlist").innerHTML = `<div class="glass empty">Could not load matches.</div>`; return; }
  const rows = [];
  for (const l of data.live) rows.push(`<div class="mrow glass" onclick="location.hash='#/live'"><div><span class="pill ok"><span class="dot"></span>live</span><div class="tiny muted" style="margin-top:4px">${esc(l.clock)}</div></div>
    <div class="heroes">${l.players.map(p => `<span class="hchip" style="padding:4px 10px">${esc(p)}</span>`).join("")}</div><span class="small muted">in progress</span></div>`);
  for (const m of data.matches) {
    const res = m.won === true ? `<div class="res w">VICTORY</div>` : m.won === false ? `<div class="res l">DEFEAT</div>` : `<div class="res">GAME</div>`;
    rows.push(`<div class="mrow glass" onclick="location.hash='#/match/${encodeURIComponent(m.match_id)}'">
      <div>${res}<div class="tiny muted">${mmss(m.duration)} &middot; ${esc(dateStr(m.started_ms))}</div></div>
      <div class="heroes">${m.players.map(p => `<span class="hchip" style="padding:4px 10px" title="${esc(p.low || "")}"><span><b>${esc(p.name)}</b> <span class="muted">${esc(p.hero_name)}</span></span>${p.fights ? `<span class="fchip ${p.low ? "bad" : ""}">fights ${esc(p.fights.replace(" of ", "/"))}</span>` : ""}</span>`).join("")}</div>
      <div class="small text2" style="text-align:right">${m.enemies && m.enemies.length ? "vs " + esc(m.enemies.join(", ")) : ""}</div></div>`);
  }
  $("mlist").innerHTML = rows.join("") || `<div class="glass empty">No games recorded yet. Play one with the program running, and the report shows up here.</div>`;
}

// ---------------------------------------------------------------- match detail
function metric(label, value, cls = "") { return `<div class="m ${cls}"><b>${value}</b><span>${label}</span></div>`; }
const SRC = { replay: "from the replay", measured: "measured", estimate: "estimate" };

function factList(cards) {
  if (!cards.length) return `<p class="small muted">No facts for this player.</p>`;
  return `<ul class="facts">${cards.map(c => `<li class="${esc(c.tone)}"><span class="dot"></span><div>${esc(c.text)}
    <div class="meta"><span class="tag">${esc(SRC[c.source] || c.source)}</span>${c.usual ? `<span class="tag ${esc(c.trend || "")}">${esc(c.usual)}${c.trend && c.trend !== "same" ? " &middot; " + esc(c.trend) + " than usual" : ""}</span>` : ""}</div></div></li>`).join("")}</ul>`;
}

function odNote(r) {
  const od = r.od || {};
  const map = { done: ["ok", "replay facts in"], parsing: ["warn", "waiting for the replay"], waiting: ["warn", "replay facts coming"], unavailable: ["bad", "no replay facts"], off: ["", "replay facts off"] };
  const [cls, text] = map[od.state] || ["", "measured only"];
  return `<span class="pill ${cls}" title="${esc(od.note || "")}">${esc(text)}</span>`;
}

// ---- fight replay: positions are fetched only when a fight is opened.
const COLORS = ["#35e0bd", "#7c8cff", "#ffb547", "#ff6fae", "#7fdc6a", "#5ad0ff", "#e8e26a", "#c39bff", "#ff8a65", "#9ad6c8"];
let replayState = null;

async function openReplay(r, i) {
  const f = r.fights[i];
  const box = $("replay");
  if (!box) return;
  box.classList.add("on");
  box.innerHTML = `<div class="small muted">Loading the fight...</div>`;
  if (replayState) cancelAnimationFrame(replayState.raf);
  let data;
  try { data = await api(`/api/matches/${encodeURIComponent(r.match_id)}/replay?from=${f.start - 15}&to=${f.end + 6}`); } catch (e) { box.innerHTML = `<div class="small muted">Replay data is not available.</div>`; return; }
  const ps = data.players.filter(p => p.pts.length);
  if (!ps.length) { box.innerHTML = `<div class="small muted">Nobody running the app was recorded around this fight.</div>`; return; }
  box.innerHTML = `<canvas id="rc" width="480" height="480"></canvas><div>
    <b>${esc(f.clock)} &middot; ${esc(f.result)}</b> <span class="small muted">kills ${f.our_kills}, deaths ${f.our_deaths}</span>
    <div class="ctl"><button class="btn small" id="rplay">Pause</button><input type="range" id="rpos" min="${data.from}" max="${data.to}" step="0.1" value="${data.from}"><span class="small" id="rclock"></span></div>
    <div class="who">${ps.map((p, k) => `<span><i style="background:${COLORS[k % COLORS.length]}"></i>${esc(p.name)} <span class="muted">${esc(p.hero)}</span></span>`).join("<br>")}</div>
    <div class="tiny muted" style="margin-top:8px">Only players running the app have positions. Ring = health, cross = dead, shaded circle = where the fight was.</div></div>`;
  const cv = $("rc"), g = cv.getContext("2d");
  const S = 480, sx = (x) => S / 2 + x / 8200 * (S / 2 - 8), sy = (y) => S / 2 - y / 8200 * (S / 2 - 8);
  const at = (pts, t) => {
    let a = pts[0], b = pts[pts.length - 1];
    for (let k = 0; k < pts.length; k++) { if (pts[k][0] <= t) a = pts[k]; if (pts[k][0] >= t) { b = pts[k]; break; } }
    const span = b[0] - a[0], u = span > 0 ? (t - a[0]) / span : 0;
    return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u, u < 0.5 ? a[4] : b[4]];
  };
  const st = { t: data.from, playing: true, last: 0, raf: 0 };
  replayState = st;
  const draw = () => {
    g.clearRect(0, 0, S, S);
    g.strokeStyle = "rgba(124,140,255,0.18)"; g.lineWidth = 18; g.lineCap = "round";
    g.beginPath(); g.moveTo(24, S - 24); g.lineTo(S - 24, 24); g.stroke();
    g.fillStyle = "rgba(63,207,110,0.18)"; g.beginPath(); g.arc(30, S - 30, 18, 0, 7); g.fill();
    g.fillStyle = "rgba(255,90,95,0.18)"; g.beginPath(); g.arc(S - 30, 30, 18, 0, 7); g.fill();
    if (f.x || f.y) { g.fillStyle = "rgba(255,255,255,0.06)"; g.beginPath(); g.arc(sx(f.x), sy(f.y), 3000 / 8200 * (S / 2), 0, 7); g.fill(); }
    ps.forEach((p, k) => {
      const [x, y, hp, alive] = at(p.pts, st.t), cx = sx(x), cy = sy(y), c = COLORS[k % COLORS.length];
      if (!alive) {
        g.strokeStyle = c; g.lineWidth = 3; g.beginPath(); g.moveTo(cx - 7, cy - 7); g.lineTo(cx + 7, cy + 7); g.moveTo(cx + 7, cy - 7); g.lineTo(cx - 7, cy + 7); g.stroke();
        return;
      }
      g.strokeStyle = "rgba(255,255,255,0.15)"; g.lineWidth = 4; g.beginPath(); g.arc(cx, cy, 13, 0, 7); g.stroke();
      g.strokeStyle = hp < 0.3 ? "#ff5a5f" : "#3fcf6e"; g.beginPath(); g.arc(cx, cy, 13, -Math.PI / 2, -Math.PI / 2 + hp * 2 * Math.PI); g.stroke();
      g.fillStyle = c; g.beginPath(); g.arc(cx, cy, 8, 0, 7); g.fill();
      g.fillStyle = "#e9eef5"; g.font = "600 15px Inter, sans-serif"; g.fillText(p.name.slice(0, 10), cx + 16, cy + 5);
    });
    $("rclock").textContent = mmss(Math.floor(st.t));
    $("rpos").value = st.t;
  };
  const tick = (now) => {
    if (!$("rc")) return;
    if (st.playing) {
      if (st.last) st.t += (now - st.last) / 1000 * 3; // three times real speed
      if (st.t >= data.to) { st.t = data.to; st.playing = false; $("rplay").textContent = "Play"; }
    }
    st.last = now;
    draw();
    st.raf = requestAnimationFrame(tick);
  };
  $("rplay").onclick = () => { if (st.t >= data.to) st.t = data.from; st.playing = !st.playing; st.last = 0; $("rplay").textContent = st.playing ? "Pause" : "Play"; };
  $("rpos").oninput = (e) => { st.t = +e.target.value; st.playing = false; $("rplay").textContent = "Play"; };
  st.raf = requestAnimationFrame(tick);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function fightStrip(r, W) {
  const H = 54, pad = 8, dur = Math.max(r.duration, 60);
  const x = (t) => pad + (t / dur) * (W - 2 * pad);
  const col = { won: "var(--good)", lost: "var(--bad)", traded: "var(--warn)", standoff: "var(--muted)" };
  let ticks = "";
  for (let m = 0; m <= dur / 60; m += 5) ticks += `<line x1="${x(m * 60)}" x2="${x(m * 60)}" y1="${H - 14}" y2="${H - 10}" stroke="rgba(160,190,230,0.3)"/>
    <text x="${x(m * 60)}" y="${H}" fill="#6c788b" font-size="11" text-anchor="middle">${m}m</text>`;
  const marks = r.fights.map((f, i) => {
    const w = Math.max(6, x(f.end) - x(f.start));
    return `<rect class="fm" data-i="${i}" x="${x(f.start) - 2}" y="6" width="${w + 4}" height="26" rx="4" fill="${col[f.result] || "var(--muted)"}" stroke="#0c1017" stroke-width="2" style="cursor:pointer"/>`;
  }).join("");
  return `<div class="chart" id="fchart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <rect x="${pad}" y="17" width="${W - 2 * pad}" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>${ticks}${marks}</svg><div class="tip" id="ftip"></div></div>
    <div class="legend"><span><i style="background:var(--good)"></i>won</span><span><i style="background:var(--bad)"></i>lost</span><span><i style="background:var(--warn)"></i>traded</span><span class="muted">click a fight to replay it</span></div>`;
}

function spreadChart(r, W) {
  const pts = r.timeline.filter(p => p.alive >= 2);
  if (pts.length < 3) return `<div class="small muted">Not enough position data for this chart.</div>`;
  const H = 190, L = 44, B = 24, T = 10, dur = Math.max(r.duration, 60);
  const maxV = Math.max(4000, ...pts.map(p => p.spread));
  const x = (t) => L + (t / dur) * (W - L - 8), y = (v) => T + (1 - v / maxV) * (H - T - B);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)} ${y(p.spread).toFixed(1)}`).join("");
  let grid = "";
  for (let v = 0; v <= maxV; v += 2000) grid += `<line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(160,190,230,0.08)"/><text x="${L - 8}" y="${y(v) + 4}" fill="#6c788b" font-size="11" text-anchor="end">${v / 1000}k</text>`;
  for (let m = 0; m <= dur / 60; m += 10) grid += `<text x="${x(m * 60)}" y="${H - 6}" fill="#6c788b" font-size="11" text-anchor="middle">${m}m</text>`;
  const bands = r.fights.map(f => `<rect x="${x(f.start)}" y="${T}" width="${Math.max(3, x(f.end) - x(f.start))}" height="${H - T - B}" fill="rgba(255,255,255,0.05)"/>`).join("");
  return `<div class="chart" id="schart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${grid}${bands}
    <path d="${path} L${x(pts[pts.length - 1].t)} ${y(0)} L${x(pts[0].t)} ${y(0)} Z" fill="rgba(53,224,189,0.10)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <line id="scross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="rgba(233,238,245,0.35)" style="display:none"/>
    <circle id="sdot" r="4.5" fill="var(--accent)" stroke="#0c1017" stroke-width="2" style="display:none"/>
    <rect id="shit" x="${L}" y="0" width="${W - L - 8}" height="${H}" fill="transparent"/></svg><div class="tip" id="stip"></div></div>
    <div class="small muted" style="margin-top:6px">Average distance of living players from the team's centre. Low = together, high = scattered. Shaded = fights.</div>`;
}

function wireCharts(r, W) {
  const fc = $("fchart");
  if (fc) {
    const tip = $("ftip");
    fc.querySelectorAll(".fm").forEach(el => {
      el.addEventListener("mouseenter", () => {
        const f = r.fights[+el.dataset.i];
        tip.innerHTML = `<b>${esc(f.clock)} &middot; ${esc(f.result)}</b><br>Kills ${f.our_kills} &middot; deaths ${f.our_deaths}<br>
          <span style="color:var(--good)">In:</span> ${esc(f.present.join(", ") || "-")}<br><span style="color:var(--bad)">Missing:</span> ${esc(f.absent.join(", ") || "nobody")}`;
        const b = el.getBoundingClientRect(), p = fc.getBoundingClientRect();
        tip.style.left = `${b.left - p.left + b.width / 2}px`; tip.style.top = `${b.top - p.top}px`; tip.style.display = "block";
      });
      el.addEventListener("mouseleave", () => tip.style.display = "none");
      el.addEventListener("click", () => openReplay(r, +el.dataset.i));
    });
  }
  const sc = $("schart");
  if (sc) {
    const pts = r.timeline.filter(p => p.alive >= 2), svg = sc.querySelector("svg"), tip = $("stip");
    const H = 190, L = 44, B = 24, T = 10, dur = Math.max(r.duration, 60);
    const maxV = Math.max(4000, ...pts.map(p => p.spread));
    const x = (t) => L + (t / dur) * (W - L - 8), y = (v) => T + (1 - v / maxV) * (H - T - B);
    const hit = $("shit");
    hit.addEventListener("mousemove", (ev) => {
      const b = svg.getBoundingClientRect();
      const t = ((ev.clientX - b.left) / b.width * W - L) / (W - L - 8) * dur;
      let best = pts[0];
      for (const p of pts) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
      const cx = x(best.t), cy = y(best.spread);
      $("scross").setAttribute("x1", cx); $("scross").setAttribute("x2", cx); $("scross").style.display = "";
      $("sdot").setAttribute("cx", cx); $("sdot").setAttribute("cy", cy); $("sdot").style.display = "";
      tip.innerHTML = `<b>${mmss(best.t)}</b><br>Spread ${km(best.spread)} &middot; ${best.alive} alive<br>Team gold on hand ${best.gold}`;
      tip.style.left = `${cx / W * b.width}px`; tip.style.top = `${cy / H * b.height}px`; tip.style.display = "block";
    });
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; $("scross").style.display = "none"; $("sdot").style.display = "none"; });
  }
}

function aiBlock(r) {
  const s = r.ai_status || "";
  let body;
  if (r.ai_review) {
    body = `<div class="body">${esc(r.ai_review).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</div>`;
  } else if (s === "writing") {
    body = `<div class="body muted">The AI coach is writing this review. Refresh in a minute.</div>`;
  } else if (s === "off") {
    body = `<div class="body muted">AI reviews are switched off on the server.</div>`;
  } else {
    body = `<div class="body muted">${s.startsWith("failed") ? "The review could not be written: " + esc(s.slice(8)) : "No review yet."}</div>`;
  }
  return `<div class="ai glass"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px">
    <h2 style="margin:0;font-size:18px">What we learn from this game</h2><button class="btn small" id="rereview">Write again</button></div>${body}</div>`;
}

async function matchPage(id) {
  if (!key) return needKey(() => matchPage(id));
  app.innerHTML = `<div class="wrap page"><div class="glass empty">Loading report...</div></div>`;
  let r;
  try { r = await api(`/api/matches/${encodeURIComponent(id)}`); } catch (e) {
    if (e.code === 401) { forgetKey(); return; }
    app.innerHTML = `<div class="wrap page"><div class="glass empty">This match was not found. <a href="#/matches">Back to matches</a></div></div>`; return;
  }
  const res = r.won === true ? `<span class="res w">VICTORY</span>` : r.won === false ? `<span class="res l">DEFEAT</span>` : `<span class="res">GAME</span>`;
  const fw = r.fights.filter(f => f.result === "won").length, fl = r.fights.filter(f => f.result === "lost").length;
  const cards = r.players.map(p => `<div class="prep glass">
      <div class="title">${esc(p.title)}</div>
      <div class="display" style="font-size:21px;font-weight:600">${esc(p.name)}</div>
      <div class="small muted">${esc(p.hero_name)} &middot; ${p.k}/${p.d}/${p.a}${p.app ? "" : ` &middot; <span class="noapp">no app: replay facts only</span>`}</div>
      ${factList(p.cards || [])}
      ${p.worst.length ? `<h3 style="margin-top:14px;font-size:14px;color:var(--bad)">Worst moments</h3><ul class="moments bad">${p.worst.map(w => `<li><time>${esc(w.clock)}</time>${esc(w.text)}</li>`).join("")}</ul>` : ""}
      ${p.best.length ? `<h3 style="margin-top:14px;font-size:14px;color:var(--good)">Best moments</h3><ul class="moments good">${p.best.map(w => `<li><time>${esc(w.clock)}</time>${esc(w.text)}</li>`).join("")}</ul>` : ""}
    </div>`).join("");
  const killers = (r.killers || []).slice(0, 4).map(([h, n]) => `<div class="m"><b>${n}</b><span>deaths to ${esc(h)}</span></div>`).join("");
  app.innerHTML = `<div class="wrap page">
    <a href="#/matches" class="small">&larr; All matches</a>
    <div class="mhead glass" style="margin-top:12px"><div><div class="big">${res}</div><div class="text2">${esc(r.summary)}</div>
      <div class="tiny muted" style="margin-top:6px">Match ${esc(r.match_id)} &middot; ${esc(dateStr(r.started_ms))} &middot; ${odNote(r)}</div>
      ${r.enemies && r.enemies.length ? `<div class="small text2" style="margin-top:6px">Against ${esc(r.enemies.join(", "))}</div>` : ""}</div>
      <div class="stats"><div class="stat"><b>${mmss(r.duration)}</b><span>duration</span></div><div class="stat"><b>${r.fights.length}</b><span>team fights</span></div>
      <div class="stat"><b style="color:var(--good)">${fw}</b><span>won</span></div><div class="stat"><b style="color:var(--bad)">${fl}</b><span>lost</span></div></div></div>
    ${aiBlock(r)}
    <div class="panel glass" style="margin-bottom:16px"><h2>Team fights <span class="small muted">${r.fights_source === "replay" ? "(from the replay)" : "(measured)"}</span></h2><div id="fwrap"></div><div class="replay" id="replay"></div></div>
    <div class="two">
      <div class="panel glass"><h2>How spread out you were</h2><div id="swrap"></div></div>
      <div class="panel glass"><h2>Who killed us</h2>${killers ? `<div class="mgrid">${killers}</div>` : `<p class="small muted">Comes with the replay facts.</p>`}</div>
    </div>
    <div class="players">${cards}</div></div>`;
  const draw = () => {
    const fwp = $("fwrap"), sw = $("swrap");
    if (!fwp || !sw) return;
    fwp.innerHTML = fightStrip(r, Math.max(260, fwp.clientWidth));
    sw.innerHTML = spreadChart(r, Math.max(260, sw.clientWidth));
    wireCharts(r, Math.max(260, sw.clientWidth));
  };
  draw();
  let rt;
  const onResize = () => { clearTimeout(rt); rt = setTimeout(draw, 120); };
  window.addEventListener("resize", onResize);
  cleanup = () => { window.removeEventListener("resize", onResize); if (replayState) cancelAnimationFrame(replayState.raf); };
  $("rereview").onclick = async () => {
    $("rereview").disabled = true; $("rereview").textContent = "Writing...";
    try { await api(`/api/matches/${encodeURIComponent(id)}/review`, { method: "POST" }); } catch (e) {}
    const poll = setInterval(async () => {
      try { const n = await api(`/api/matches/${encodeURIComponent(id)}`); if (n.ai_status !== "writing") { clearInterval(poll); if (location.hash.includes(id)) matchPage(id); } } catch (e) { clearInterval(poll); }
    }, 5000);
    { const prev = cleanup; cleanup = () => { if (prev) prev(); clearInterval(poll); }; }
  };
  if (r.ai_status === "writing") {
    const poll = setInterval(async () => {
      try { const n = await api(`/api/matches/${encodeURIComponent(id)}`); if (n.ai_status !== "writing") { clearInterval(poll); matchPage(id); } } catch (e) { clearInterval(poll); }
    }, 8000);
    { const prev = cleanup; cleanup = () => { if (prev) prev(); clearInterval(poll); }; }
  }
}

// ---------------------------------------------------------------- players
function spark(vals, upGood) {
  if (vals.length < 2) return `<span class="tiny muted">trend after 2 games</span>`;
  const W = 120, H = 28, max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const x = (i) => 3 + i / (vals.length - 1) * (W - 6), y = (v) => 3 + (1 - (v - min) / (max - min || 1)) * (H - 6);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
  const last = vals[vals.length - 1], prev = vals.slice(0, -1).reduce((a, b) => a + b, 0) / (vals.length - 1);
  const better = (last > prev) === upGood, same = Math.abs(last - prev) < Math.max(0.5, Math.abs(prev) * 0.15);
  const c = same ? "var(--muted)" : better ? "var(--good)" : "var(--bad)";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Per game, oldest first"><path d="${d}" fill="none" stroke="${c}" stroke-width="2"/><circle cx="${x(vals.length - 1)}" cy="${y(last)}" r="3" fill="${c}"/></svg>`;
}

async function players() {
  if (!key) return needKey(players);
  app.innerHTML = `<div class="wrap page"><div class="pagehead"><div><h2 class="display" style="margin:0">Players</h2>
    <div class="small muted">Each of you across all recorded games. Line colour = the last game compared with the ones before (green better, red worse).</div></div></div><div id="plist" class="players"><div class="glass empty">Loading...</div></div></div>`;
  let list;
  try { list = await api("/api/players"); } catch (e) { if (e.code === 401) { forgetKey(); return; } $("plist").innerHTML = `<div class="glass empty">Could not load players.</div>`; return; }
  const top = (o) => Object.entries(o).sort((a, b) => b[1] - a[1])[0];
  const fmt = (f) => f.label.includes("%") ? Math.round(f.avg) + "%" : f.avg;
  $("plist").innerHTML = list.map(p => {
    const t = top(p.titles), h = top(p.heroes);
    return `<div class="prep glass"><div class="title">${t ? esc(t[0]) : ""}</div>
      <div class="display" style="font-size:21px;font-weight:600">${esc(p.name)}</div>
      <div class="small muted">${p.games} games &middot; ${p.wins} wins${h ? " &middot; most played " + esc(h[0]) : ""}</div>
      <table class="tbl" style="margin-top:10px">${p.facts.map(f => `<tr><td>${esc(f.label)}</td><td style="text-align:right;white-space:nowrap"><b>${fmt(f)}</b></td><td style="width:126px">${spark(f.values, f.up_good)}</td></tr>`).join("")}</table>
    </div>`;
  }).join("") || `<div class="glass empty" style="grid-column:1/-1">No games recorded yet.</div>`;
}

route();
</script>
