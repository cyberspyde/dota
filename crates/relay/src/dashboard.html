<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Board</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#262c36; --text:#e6e9ee; --muted:#8b94a3;
          --hp:#3fb950; --hpLow:#f85149; --mana:#4c8dff; --warn:#f0b429; --bad:#f85149; --ok:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  .pill { padding:2px 8px; border-radius:99px; background:var(--card); color:var(--muted); font-size:12px; }
  .pill.ok { color:var(--ok); } .pill.bad { color:var(--bad); }
  main { padding:16px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card.attack { border-color:var(--bad); box-shadow:0 0 0 1px var(--bad) inset; }
  .card.dead { opacity:.6; }
  .top { display:flex; justify-content:space-between; gap:8px; }
  .name { font-weight:600; } .hero { color:var(--muted); font-size:12px; }
  .bar { height:6px; background:#0b0d11; border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; }
  .row { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .it { font-size:11px; padding:1px 6px; border-radius:4px; background:#0b0d11; color:var(--muted); }
  .it.key { color:var(--warn); } .it.cd { text-decoration:line-through; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  #feed { padding:0 16px 16px; }
  #feed div { color:var(--muted); font-size:13px; padding:2px 0; }
  #feed b { color:var(--warn); }
  form { display:flex; gap:8px; padding:0 16px 16px; flex-wrap:wrap; }
  input, select, button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  input { flex:1; min-width:160px; }
  button { cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>TEAM BOARD</h1>
  <span id="conn" class="pill bad">offline</span>
  <span id="rtt" class="pill">-- ms</span>
  <span id="clock" class="pill">--:--</span>
</header>
<main id="cards"></main>
<form id="noteForm">
  <select id="noteTo"><option value="">Everyone</option></select>
  <input id="noteText" maxlength="200" placeholder="Tip for the team, e.g. 'buy BKB, they have 3 disables'">
  <button>Send</button>
</form>
<div id="feed"></div>
<script>
const key = new URLSearchParams(location.hash.slice(1)).get("key") || prompt("Team key");
const members = new Map(); // id -> {name, role, state, hpHist:[[t,frac]]}
let me = null, ws = null, pingSent = new Map(), pingSeq = 0;
const $ = (id) => document.getElementById(id);

const SPECIAL = {antimage:"Anti-Mage",nevermore:"Shadow Fiend",zuus:"Zeus",obsidian_destroyer:"Outworld Destroyer",wisp:"Io",
  magnataur:"Magnus",furion:"Nature's Prophet",skeleton_king:"Wraith King",rattletrap:"Clockwerk",shredder:"Timbersaw",
  treant:"Treant Protector",windrunner:"Windranger",vengefulspirit:"Vengeful Spirit",queenofpain:"Queen of Pain",
  doom_bringer:"Doom",centaur:"Centaur Warrunner",life_stealer:"Lifestealer",abyssal_underlord:"Underlord",necrolyte:"Necrophos"};
const heroName = (h) => SPECIAL[h] || h.split("_").map(w => w[0]?.toUpperCase() + w.slice(1)).join(" ");
const KEY_ITEMS = new Set(["black_king_bar","blink","overwhelming_blink","swift_blink","arcane_blink","glimmer_cape","force_staff",
  "hurricane_pike","sheepstick","cyclone","wind_waker","lotus_orb","pipe","mekansm","guardian_greaves","refresher","aeon_disk",
  "sphere","silver_edge","invis_sword","abyssal_blade","bloodthorn","orchid","nullifier","smoke_of_deceit","gem","aegis","cheese"]);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = (s) => `${s < 0 ? "-" : ""}${Math.floor(Math.abs(s) / 60)}:${String(Math.abs(s) % 60).padStart(2, "0")}`;

function feed(html) {
  const d = document.createElement("div");
  d.innerHTML = `<span>${new Date().toLocaleTimeString()}</span> ${html}`;
  $("feed").prepend(d);
  while ($("feed").children.length > 30) $("feed").lastChild.remove();
}

function underAttack(m) {
  const now = performance.now();
  m.hpHist = (m.hpHist || []).filter(([t]) => now - t < 2000);
  if (!m.state || !m.state.alive || m.hpHist.length < 2) return false;
  const peak = Math.max(...m.hpHist.map(([, f]) => f));
  return peak - m.hpHist[m.hpHist.length - 1][1] >= 0.15;
}

function render() {
  const cards = [];
  let clock = null;
  const sel = $("noteTo"), cur = sel.value;
  sel.innerHTML = '<option value="">Everyone</option>';
  for (const [id, m] of members) {
    if (m.role !== "player") continue;
    sel.insertAdjacentHTML("beforeend", `<option value="${id}">${esc(m.name)}</option>`);
    const s = m.state;
    if (!s || !s.hero) {
      cards.push(`<div class="card"><div class="name">${esc(m.name)}</div><div class="meta">not in a match</div></div>`);
      continue;
    }
    clock = s.clock;
    const hp = s.max_health ? s.health / s.max_health : 0;
    const mp = s.max_mana ? s.mana / s.max_mana : 0;
    const ult = (s.abilities || []).find(a => a.ultimate);
    const ultTxt = !ult || ult.level === 0 ? "ult: not learned" : ult.cooldown > 0 ? `ult: ${ult.cooldown}s` : "ult: READY";
    const tp = s.tp ? (s.tp.cooldown > 0 ? `TP ${s.tp.cooldown}s` : "TP ready") : "no TP";
    const items = (s.items || []).map(i =>
      `<span class="it ${KEY_ITEMS.has(i.name) ? "key" : ""} ${i.cooldown > 0 ? "cd" : ""}">${esc(heroName(i.name))}${i.cooldown > 0 ? " " + i.cooldown : ""}</span>`).join("");
    const atk = underAttack(m);
    const status = !s.alive ? `DEAD - ${s.respawn_seconds}s, buyback ${s.buyback_cooldown > 0 ? "on cd" : s.gold >= s.buyback_cost ? "available" : "no gold"}`
      : atk ? "UNDER ATTACK" : s.smoked ? "smoked" : "";
    cards.push(`<div class="card ${!s.alive ? "dead" : ""} ${atk ? "attack" : ""}">
      <div class="top"><div><div class="name">${esc(m.name)}</div><div class="hero">${esc(heroName(s.hero))} - lvl ${s.level}</div></div>
      <div class="hero">${s.kills}/${s.deaths}/${s.assists}<br>${s.gold}g</div></div>
      <div class="bar"><i style="width:${hp * 100}%;background:${hp < .3 ? "var(--hpLow)" : "var(--hp)"}"></i></div>
      <div class="bar"><i style="width:${mp * 100}%;background:var(--mana)"></i></div>
      <div class="meta">${s.health}/${s.max_health} HP - ${ultTxt} - ${tp}</div>
      ${status ? `<div class="meta" style="color:var(--bad)">${status}</div>` : ""}
      <div class="row">${items}</div></div>`);
  }
  sel.value = cur;
  $("cards").innerHTML = cards.join("") || '<div class="meta">Waiting for players...</div>';
  if (clock !== null) $("clock").textContent = mmss(clock);
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({t:"hello", key, name:"board", role:"viewer", version:1}));
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    switch (m.t) {
      case "welcome":
        me = m.you; members.clear();
        for (const x of m.members) members.set(x.id, {...x, hpHist: []});
        $("conn").textContent = "live"; $("conn").className = "pill ok"; break;
      case "joined": members.set(m.member.id, {...m.member, hpHist: []}); feed(`${esc(m.member.name)} joined`); break;
      case "left": { const x = members.get(m.id); if (x) feed(`${esc(x.name)} left`); members.delete(m.id); break; }
      case "state": {
        const x = members.get(m.id); if (!x) break;
        x.state = m.state;
        if (m.state.max_health) x.hpHist.push([performance.now(), m.state.health / m.state.max_health]);
        break;
      }
      case "callout": { const x = members.get(m.id); feed(`<b>${esc(x ? x.name : "?")}: ${m.kind.replace("_", " ").toUpperCase()}</b>`); break; }
      case "note": { const x = m.id === me ? {name: "you (board)"} : members.get(m.id) || {name: "team board"}; const to = m.to ? members.get(m.to) : null;
        feed(`<b>${esc(x.name)}${to ? " -> " + esc(to.name) : ""}:</b> ${esc(m.text)}`); break; }
      case "pong": { const t = pingSent.get(m.id); if (t) $("rtt").textContent = `${Math.round(performance.now() - t)} ms`; pingSent.delete(m.id); break; }
      case "error": feed(`<b>relay:</b> ${esc(m.message)}`); break;
    }
    render();
  };
  ws.onclose = () => { $("conn").textContent = "offline"; $("conn").className = "pill bad"; setTimeout(connect, 1000); };
}

setInterval(() => {
  if (ws && ws.readyState === 1) { const id = ++pingSeq; pingSent.set(id, performance.now()); ws.send(JSON.stringify({t:"ping", id})); }
  render();
}, 1000);

$("noteForm").onsubmit = (e) => {
  e.preventDefault();
  const text = $("noteText").value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  const to = $("noteTo").value ? Number($("noteTo").value) : null;
  ws.send(JSON.stringify({t:"note", to, text}));
  $("noteText").value = "";
};
connect();
</script>
</body>
</html>
