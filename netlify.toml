# The web helper lives in legacy-helper/ since the repo became the team tool.
# This keeps the existing Netlify site building from that folder.
# Paths below (publish, functions) are relative to `base`.
[build]
  base = "legacy-helper"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
